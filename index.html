<style>
/* Layout: full-bleed satellite frame; caption anchored bottom-left like a map legend,
   tool rail top-right, a constellation inset of every place bottom-right. Single dark look over imagery. */
:root{
  --ink:#0b1412;          /* deep paddy-water black */
  --paper:#f2f4ef;        /* caption text */
  --muted:#b9c4bd;        /* secondary text */
  --lotus:#e9a6b4;        /* accent: sen hồng */
  --jade:#7fc8a9;         /* inset dots */
  --glass:rgba(11,20,18,.55);
  --line:rgba(242,244,239,.18);
  --display:"Fraunces", "Iowan Old Style", Georgia, serif;
  --body:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lotus);outline-offset:2px}

#stage{position:fixed;inset:0;overflow:hidden;background:var(--ink)}
.layer{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease}
.layer.on{opacity:1}
.layer img{position:absolute;display:block;user-select:none;-webkit-user-drag:none;max-width:none}
#scrim{position:fixed;inset:auto 0 0 0;height:min(55vh,460px);pointer-events:none;
  background:linear-gradient(to top,rgba(5,10,9,.82),rgba(5,10,9,.35) 45%,transparent)}
#topscrim{position:fixed;inset:0 0 auto 0;height:120px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(5,10,9,.45),transparent)}

#loader{position:fixed;left:50%;top:50%;translate:-50% -50%;font:500 12px var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);opacity:0;transition:opacity .3s}
#loader.on{opacity:1}

/* Caption */
#caption{position:fixed;left:0;bottom:0;max-width:min(680px,100%);
  padding:0 16px calc(28px + env(safe-area-inset-bottom,0px)) max(28px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;transition:opacity .4s}
.eyebrow{font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--lotus);display:flex;gap:10px;flex-wrap:wrap}
.eyebrow span+span::before{content:"·";margin-right:10px;color:var(--muted)}
#name{font:600 clamp(30px,5.2vw,64px)/1.02 var(--display);font-variation-settings:"opsz" 144;margin:0;text-wrap:balance;
  text-shadow:0 2px 24px rgba(0,0,0,.45)}
#alt{font:400 clamp(15px,1.5vw,18px)/1.35 var(--body);color:var(--muted);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:4px}
.meta b{font-weight:500;color:var(--paper)}

/* Tool rail */
#rail{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:2px;padding:4px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);transition:opacity .4s}
.ic{width:40px;height:40px;display:grid;place-items:center;border:0;background:transparent;border-radius:10px;cursor:pointer;color:var(--paper)}
.ic:hover{background:rgba(242,244,239,.12)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ic.fav[aria-pressed="true"]{color:var(--lotus)}
.ic.fav[aria-pressed="true"] svg{fill:var(--lotus)}
.sep{width:1px;margin:8px 3px;background:var(--line)}
#langBtn{font:600 12px var(--mono);letter-spacing:.04em}

/* Brand */
#brand{position:fixed;top:calc(22px + env(safe-area-inset-top,0px));left:max(28px,env(safe-area-inset-left,0px));
  font:600 13px var(--body);letter-spacing:.02em;display:flex;align-items:baseline;gap:10px;transition:opacity .4s}
#brand i{font:italic 400 18px var(--display);letter-spacing:0}
#count{font:400 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* Next arrows on edges */
.edge{position:fixed;top:50%;translate:0 -50%;width:48px;height:88px;border:0;background:transparent;cursor:pointer;
  color:var(--paper);opacity:0;transition:opacity .25s;display:grid;place-items:center}
.edge svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}
#stage:hover~.edge,.edge:hover,.edge:focus-visible{opacity:.9}
#prevEdge{left:max(8px,env(safe-area-inset-left,0px))}
#nextEdge{right:max(8px,env(safe-area-inset-right,0px))}

/* Constellation inset */
#inset{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));
  width:150px;height:170px;transition:opacity .4s}
#inset canvas{width:100%;height:100%;display:block}
#insetLabel{position:absolute;left:0;bottom:-2px;font:400 10px var(--mono);color:var(--muted);letter-spacing:.06em}

#attrib{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(6px + env(safe-area-inset-bottom,0px));
  font:400 10px var(--body);color:rgba(242,244,239,.6)}

body.clean #caption,body.clean #rail,body.clean #brand,body.clean #inset,body.clean #scrim,body.clean #topscrim,body.clean .edge{opacity:0;pointer-events:none}
body.clean #unhide{display:grid}
#unhide{display:none;position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  background:var(--glass);border:1px solid var(--line);border-radius:12px;opacity:.35}
#unhide:hover{opacity:1}

/* Panels */
.panel{position:fixed;inset:0;display:flex;justify-content:flex-end;background:rgba(3,8,7,.45)}
.sheet{width:min(560px,100%);height:100%;background:#0f1a17;border-left:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) 20px}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sheet h2{font:600 26px var(--display);margin:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font:500 13px var(--body);cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start;padding-bottom:8px}
.card{border:0;padding:0;background:transparent;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .th{aspect-ratio:4/3;border-radius:8px;background:#1b2925 center/cover no-repeat;max-width:100%}
.card:hover .th{outline:2px solid var(--lotus);outline-offset:2px}
.card strong{font:500 13px/1.25 var(--body);overflow-wrap:anywhere}
.card small{font:400 11px var(--mono);color:var(--muted)}
.empty{grid-column:1/-1;color:var(--muted);font-size:14px;line-height:1.55;padding:24px 0}
.group{margin-bottom:18px}
.group h3{font:600 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:13px;color:var(--muted);line-height:1.55;margin-top:auto}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));translate:-50% 0;background:var(--paper);color:var(--ink);
  padding:9px 16px;border-radius:999px;font:500 13px var(--body);opacity:0;transition:opacity .25s;pointer-events:none;display:flex;gap:12px;align-items:center;white-space:nowrap}
.toast.on{opacity:1}
.toast.act{pointer-events:auto}
.toast button{border:0;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
#offline{position:fixed;left:max(18px,env(safe-area-inset-left,0px));top:calc(78px + env(safe-area-inset-top,0px));white-space:nowrap;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--paper);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:5px 12px}

@media (max-width:640px){
  #inset{width:96px;height:112px;bottom:auto;top:calc(70px + env(safe-area-inset-top,0px))}
  #insetLabel{display:none}
  #brand{display:none}
  #rail{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));justify-content:space-between;flex-wrap:wrap}
  .sep{display:none}
  .ic{width:34px;height:34px}
  #rail{padding:3px}
  #caption{padding-left:max(18px,env(safe-area-inset-left,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
  .edge{display:none}
}
@media (prefers-reduced-motion:reduce){.layer{transition:none}}
</style>
</head>
<body>
<div id="stage" aria-label="Satellite view"></div>
<div id="topscrim"></div>
<div id="scrim"></div>
<div id="loader">…</div>

<div id="brand"><i>Vicarus</i><span data-t="brand"></span><span id="count"></span></div>

<nav id="rail" aria-label="Tools">
  <button class="ic" id="prevBtn" data-tip="prev"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ic" id="nextBtn" data-tip="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="sep"></span>
  <button class="ic fav" id="favBtn" data-tip="fav" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></button>
  <a class="ic" id="mapsBtn" data-tip="maps" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M12 21s-6-5.3-6-11a6 6 0 0 1 12 0c0 5.7-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg></a>
  <button class="ic" id="dlBtn" data-tip="dl"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
  <span class="sep"></span>
  <button class="ic" id="galBtn" data-tip="gal"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></button>
  <button class="ic" id="filtBtn" data-tip="filt"><svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg></button>
  <button class="ic" id="langBtn" data-tip="lang">EN</button>
  <button class="ic" id="hideBtn" data-tip="hide"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 4l16 16"/></svg></button>
</nav>
<button class="ic" id="unhide" aria-label="Show"><svg viewBox="0 0 24 24"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="12" cy="12" r="2.5"/></svg></button>

<button class="edge" id="prevEdge" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="edge" id="nextEdge" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

<section id="caption" aria-live="polite">
  <div class="eyebrow"><span id="region"></span><span id="province"></span></div>
  <h1 id="name"></h1>
  <p id="alt"></p>
  <div class="meta"><span id="coord"></span><span id="span"></span></div>
</section>

<div id="inset" title=""><canvas id="insetCv"></canvas><div id="insetLabel"></div></div>
<div id="attrib">Imagery © Esri, Maxar, Earthstar Geographics</div>

<div class="panel" id="galPanel" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="galTitle">
    <header><h2 id="galTitle" data-t="gal"></h2><button class="ic" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="tabs"><button class="chip" id="tabFav" aria-pressed="true"></button><button class="chip" id="tabAll" aria-pressed="false"></button></div>
    <div class="grid" id="galGrid"></div>
  </div>
</div>

<div class="panel" id="filtPanel" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="filtTitle">
    <header><h2 id="filtTitle" data-t="filt"></h2><button class="ic" data-close><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div class="group"><h3 data-t="region"></h3><div class="chips" id="regionChips"></div></div>
    <div class="group"><h3 data-t="theme"></h3><div class="chips" id="themeChips"></div></div>
    <p class="note" id="filtNote"></p>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="offline" hidden></div>

<script src="places.js"></script>
<script>
(() => {
"use strict";
const TILE = (z,y,x) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
const MAXZ = 18;

const T = {
  vi:{brand:"Việt Nam từ trên cao",prev:"Trước",next:"Tiếp",fav:"Yêu thích",maps:"Mở trong Google Maps",dl:"Lưu hoặc chia sẻ hình nền",gal:"Bộ sưu tập",
      filt:"Bộ lọc",lang:"English",hide:"Ẩn chữ (H)",region:"Vùng",theme:"Chủ đề",favs:"Yêu thích",all:"Tất cả",
      R:{N:"Miền Bắc",C:"Miền Trung",S:"Miền Nam"},any:"Tất cả",
      TH:{mtn:"Núi & ruộng bậc thang",sea:"Biển & đảo",water:"Sông, hồ & châu thổ",city:"Đô thị & di sản",karst:"Núi đá vôi & hang động"},
      span:"khung rộng ≈",km:"km",empty:"Chưa có địa điểm yêu thích. Bấm ♡ khi gặp một khung cảnh bạn thích.",
      note:n=>`${n} địa điểm khớp bộ lọc. Mỗi lần mở app sẽ chọn ngẫu nhiên một địa điểm.`,
      saved:"Đã lưu hình nền",added:"Đã thêm vào yêu thích",removed:"Đã bỏ khỏi yêu thích",
      dlFail:"Không tải được: máy chủ ảnh chặn xuất hình. Hãy chụp màn hình thay thế.",loading:"Đang tải ảnh vệ tinh",
      lat:["B","N"],lon:["Đ","T"],ready:"Ảnh đã sẵn sàng",saveBtn:"Lưu ảnh",offline:"Ngoại tuyến · nơi đã xem"},
  en:{brand:"Vietnam from above",prev:"Previous",next:"Next",fav:"Favorite",maps:"Open in Google Maps",dl:"Save or share wallpaper",gal:"Gallery",
      filt:"Filters",lang:"Tiếng Việt",hide:"Hide labels (H)",region:"Region",theme:"Theme",favs:"Favorites",all:"All places",
      R:{N:"North",C:"Central",S:"South"},any:"All",
      TH:{mtn:"Mountains & terraces",sea:"Coast & islands",water:"Rivers, lakes & delta",city:"Cities & heritage",karst:"Karst & caves"},
      span:"frame ≈",km:"km wide",empty:"No favorites yet. Tap ♡ when you find a view you like.",
      note:n=>`${n} places match. Each time you open the app, one is picked at random.`,
      saved:"Wallpaper saved",added:"Added to favorites",removed:"Removed from favorites",
      dlFail:"Download blocked by the imagery server. Take a screenshot instead.",loading:"Loading satellite imagery",
      lat:["N","S"],lon:["E","W"],ready:"Image ready",saveBtn:"Save image",offline:"Offline · seen places"}
};

const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/gi,"d").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const P = window.PLACES.map((a,i)=>({i,vi:a[0],en:a[1],prov:a[2],reg:a[3],th:a[4],lat:a[5],lon:a[6],z:a[7],id:slug(a[1])}));
const byId = Object.fromEntries(P.map(p=>[p.id,p]));

const store = {
  get(k,d){try{const v=localStorage.getItem("vnfa:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("vnfa:"+k,JSON.stringify(v))}catch(e){}}
};
let lang = store.get("lang","vi");
let favs = new Set(store.get("favs",[]));
let filt = store.get("filt",{reg:"all",th:"all"});
let recent = store.get("recent",[]);
let seen = store.get("seen",[]);
const hist = []; let hpos = -1; let cur = null;

const $ = id => document.getElementById(id);
const stage = $("stage");

// ── Web Mercator
const mx = lon => (lon+180)/360;
const my = lat => { const s=Math.sin(lat*Math.PI/180); return .5 - Math.log((1+s)/(1-s))/(4*Math.PI); };

function geometry(p, W, H){
  // Zoom values are tuned for a ~1600px-wide frame; scale for this screen.
  const zEff = p.z + Math.log2(Math.max(W, H*1.5)/1600);
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const tz = Math.max(3, Math.min(MAXZ, Math.ceil(zEff + Math.log2(dpr) - 0.15)));
  const ts = 256 * Math.pow(2, zEff - tz);
  const cx = mx(p.lon)*256*Math.pow(2,zEff), cy = my(p.lat)*256*Math.pow(2,zEff);
  const ox = cx - W/2, oy = cy - H/2;
  const tiles=[]; const n=Math.pow(2,tz);
  for(let ty=Math.floor(oy/ts); ty<=Math.floor((oy+H)/ts); ty++){
    if(ty<0||ty>=n) continue;
    for(let tx=Math.floor(ox/ts); tx<=Math.floor((ox+W)/ts); tx++){
      tiles.push({x:((tx%n)+n)%n, y:ty, z:tz, l:tx*ts-ox, t:ty*ts-oy});
    }
  }
  const mpp = 156543.03392*Math.cos(p.lat*Math.PI/180)/Math.pow(2,zEff);
  return {tiles, ts, zEff, km: W*mpp/1000};
}

let renderToken = 0, lastGeo = null;
function render(p){
  const W = innerWidth, H = innerHeight, tok = ++renderToken;
  const g = geometry(p, W, H); lastGeo = {g, W, H};
  const layer = document.createElement("div"); layer.className = "layer";
  let done = 0, shown = false;
  const loader = $("loader");
  const loaderTimer = setTimeout(()=>{ if(!shown && tok===renderToken) loader.classList.add("on"); }, 500);
  const reveal = () => {
    if(shown || tok!==renderToken) return; shown = true; clearTimeout(loaderTimer); loader.classList.remove("on");
    requestAnimationFrame(()=>layer.classList.add("on"));
    [...stage.children].forEach(c=>{ if(c!==layer) setTimeout(()=>c.remove(), 1200); });
  };
  for(const t of g.tiles){
    const img = new Image();
    img.crossOrigin = "anonymous"; img.decoding = "async"; img.alt = "";
    img.style.cssText = `left:${Math.round(t.l)}px;top:${Math.round(t.t)}px;width:${Math.ceil(g.ts)+1}px;height:${Math.ceil(g.ts)+1}px`;
    const fin = () => { if(++done >= g.tiles.length*0.85) reveal(); };
    img.onload = fin;
    img.onerror = () => { if(img.crossOrigin){ img.removeAttribute("crossorigin"); img.dataset.tainted="1"; img.src = TILE(t.z,t.y,t.x)+"?nc"; } else { img.style.visibility="hidden"; fin(); } };
    img.src = TILE(t.z,t.y,t.x);
    layer.appendChild(img);
  }
  stage.appendChild(layer);
  setTimeout(reveal, 3500);
  return g;
}

// ── Caption
function dms(v, pair){
  const h = v>=0?pair[0]:pair[1]; v=Math.abs(v);
  const t=Math.round(v*3600), d=Math.floor(t/3600), m=Math.floor(t%3600/60), s=t%60;
  return `${d}°${String(m).padStart(2,"0")}′${String(s).padStart(2,"0")}″${h}`;
}
function fmtKm(k){ const v = k<10?k.toFixed(1):Math.round(k).toString(); return lang==="vi"?v.replace(".",","):v; }

function caption(p, g){
  const t = T[lang];
  $("region").textContent = t.R[p.reg];
  $("province").textContent = p.prov;
  $("name").textContent = lang==="vi"?p.vi:p.en;
  $("alt").textContent = lang==="vi"?p.en:p.vi;
  $("coord").innerHTML = `<b>${dms(p.lat,t.lat)}</b>&nbsp; <b>${dms(p.lon,t.lon)}</b>`;
  $("span").textContent = `${t.span} ${fmtKm(g.km)} ${t.km}`;
  $("favBtn").setAttribute("aria-pressed", favs.has(p.id));
  const mz = Math.max(3, Math.round(g.zEff));
  $("mapsBtn").href = `https://www.google.com/maps/@${p.lat},${p.lon},${mz}z/data=!3m1!1e3`;
  const list = pool();
  const idx = list.indexOf(p);
  $("count").textContent = idx>=0 ? `${String(idx+1).padStart(3,"0")} / ${list.length}` : "";
  $("insetLabel").textContent = `${p.lat.toFixed(2)}, ${p.lon.toFixed(2)}`;
  document.title = `${lang==="vi"?p.vi:p.en} · Vicarus`;
  drawInset(p);
}

function show(p, push=true){
  cur = p;
  if(push){ hist.splice(hpos+1); hist.push(p); hpos = hist.length-1; }
  recent = [p.id, ...recent.filter(x=>x!==p.id)].slice(0, Math.min(40, Math.floor(P.length/2)));
  store.set("recent", recent);
  seen = [p.id, ...seen.filter(x=>x!==p.id)].slice(0,300); store.set("seen", seen);
  try{ history.replaceState(null,"","#"+p.id); }catch(e){}
  const g = render(p);
  caption(p, g);
}

function pool(){
  return P.filter(p => (filt.reg==="all"||p.reg===filt.reg) && (filt.th==="all"||p.th===filt.th));
}
function randomPlace(){
  let list = pool(); if(!list.length) list = P;
  if(!navigator.onLine){ const s = list.filter(p=>seen.includes(p.id)); const s2 = P.filter(p=>seen.includes(p.id)); list = s.length>1?s:(s2.length?s2:list); }
  const fresh = list.filter(p=>!recent.includes(p.id) && p!==cur);
  const from = fresh.length ? fresh : list.filter(p=>p!==cur);
  return (from.length?from:list)[Math.floor(Math.random()*(from.length?from.length:list.length))];
}
function next(){ if(hpos < hist.length-1){ hpos++; show(hist[hpos], false); } else show(randomPlace()); }
function prev(){ if(hpos > 0){ hpos--; show(hist[hpos], false); } }

// ── Constellation inset: every place as a dot; the S-curve of the country draws itself.
const B = {w:102.0,e:115.0,s:8.2,n:23.5};
function drawInset(p){
  const cv = $("insetCv"), r = cv.getBoundingClientRect(); if(!r.width) return;
  const d = Math.min(devicePixelRatio||1,2); cv.width = r.width*d; cv.height = r.height*d;
  const c = cv.getContext("2d"); c.scale(d,d);
  const pad = 6, W = r.width-pad*2, H = r.height-pad*2-12;
  const X0=mx(B.w),X1=mx(B.e),Y0=my(B.n),Y1=my(B.s);
  const k = Math.min(W/(X1-X0), H/(Y1-Y0));
  const px = q => [pad+(mx(q.lon)-X0)*k, pad+(my(q.lat)-Y0)*k];
  c.fillStyle = "rgba(127,200,169,.55)";
  for(const q of P){ const [x,y]=px(q); c.beginPath(); c.arc(x,y,1.3,0,7); c.fill(); }
  const [x,y]=px(p);
  c.strokeStyle="rgba(233,166,180,.9)"; c.lineWidth=1.2; c.beginPath(); c.arc(x,y,6,0,7); c.stroke();
  c.fillStyle="#e9a6b4"; c.beginPath(); c.arc(x,y,2.6,0,7); c.fill();
}

// ── Favorites, toast
let toastT;
function toast(msg, action, label){
  const el=$("toast"); el.textContent=msg; el.classList.toggle("act", !!action);
  if(action){ const b=document.createElement("button"); b.textContent=label; b.onclick=()=>{ el.classList.remove("on","act"); action(); }; el.appendChild(b); }
  el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on","act"), action?7000:1800);
}
function toggleFav(){
  if(!cur) return;
  if(favs.has(cur.id)){ favs.delete(cur.id); toast(T[lang].removed); } else { favs.add(cur.id); toast(T[lang].added); }
  store.set("favs",[...favs]); $("favBtn").setAttribute("aria-pressed", favs.has(cur.id));
}

// ── Download: redraw the visible tiles onto a canvas at device resolution.
async function download(){
  if(!cur||!lastGeo) return;
  const {W,H} = lastGeo; const d = Math.min(devicePixelRatio||1,2);
  const g = geometry(cur, W, H);
  const cv = document.createElement("canvas"); cv.width=Math.round(W*d); cv.height=Math.round(H*d);
  const c = cv.getContext("2d"); c.scale(d,d); c.fillStyle="#0b1412"; c.fillRect(0,0,W,H);
  const load = t => new Promise(res=>{ const i=new Image(); i.crossOrigin="anonymous"; i.onload=()=>res(i); i.onerror=()=>res(null); i.src=TILE(t.z,t.y,t.x); });
  const imgs = await Promise.all(g.tiles.map(load));
  imgs.forEach((im,k)=>{ if(im){ const t=g.tiles[k]; c.drawImage(im, t.l, t.t, g.ts+0.5, g.ts+0.5); }});
  c.font = `500 ${Math.max(11,Math.round(W/150))}px "Be Vietnam Pro", sans-serif`;
  c.textAlign="right"; c.fillStyle="rgba(255,255,255,.75)"; c.shadowColor="rgba(0,0,0,.6)"; c.shadowBlur=6;
  c.fillText(`Vicarus · ${cur.vi} · ${cur.prov} — Imagery © Esri, Maxar`, W-18, H-16);
  let blob = null;
  try{ blob = await new Promise(r=>cv.toBlob(r,"image/png")); }catch(e){}
  if(!blob){ toast(T[lang].dlFail); return; }
  const fname = `vicarus-${cur.id}.png`;
  const file = new File([blob], fname, {type:"image/png"});
  const share = async () => {
    try{ await navigator.share({files:[file], title: lang==="vi"?cur.vi:cur.en}); }
    catch(e){ if(e && e.name==="NotAllowedError") toast(T[lang].ready, share, T[lang].saveBtn); }
  };
  if(navigator.canShare && navigator.canShare({files:[file]})){ await share(); return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast(T[lang].saved);
}

// ── Gallery
let galTab = "fav";
function thumb(p){
  const z = Math.max(3,p.z-1), n=Math.pow(2,z);
  return TILE(z, Math.floor(my(p.lat)*n), Math.floor(mx(p.lon)*n));
}
function renderGallery(){
  const t=T[lang];
  $("tabFav").textContent = `${t.favs} (${favs.size})`; $("tabAll").textContent = `${t.all} (${P.length})`;
  $("tabFav").setAttribute("aria-pressed", galTab==="fav"); $("tabAll").setAttribute("aria-pressed", galTab==="all");
  const list = galTab==="fav" ? P.filter(p=>favs.has(p.id)) : P;
  const grid = $("galGrid"); grid.innerHTML = "";
  if(!list.length){ grid.innerHTML = `<p class="empty">${t.empty}</p>`; return; }
  for(const p of list){
    const b=document.createElement("button"); b.className="card";
    b.innerHTML = `<div class="th" style="background-image:url('${thumb(p)}')"></div><strong></strong><small></small>`;
    b.querySelector("strong").textContent = lang==="vi"?p.vi:p.en;
    b.querySelector("small").textContent = p.prov;
    b.onclick = () => { closePanels(); show(p); };
    grid.appendChild(b);
  }
}

// ── Filters
function renderFilters(){
  const t=T[lang];
  const mk = (box, key, opts) => {
    box.innerHTML="";
    for(const [v,label] of opts){
      const b=document.createElement("button"); b.className="chip"; b.textContent=label;
      b.setAttribute("aria-pressed", filt[key]===v);
      b.onclick=()=>{ filt[key]=v; store.set("filt",filt); renderFilters(); };
      box.appendChild(b);
    }
  };
  mk($("regionChips"),"reg",[["all",t.any],...Object.entries(t.R)]);
  mk($("themeChips"),"th",[["all",t.any],...Object.entries(t.TH)]);
  $("filtNote").textContent = t.note(pool().length);
}

function openPanel(id){ closePanels(); $(id).hidden=false; if(id==="galPanel") renderGallery(); else renderFilters(); }
function closePanels(){
  const wasFilt = !$("filtPanel").hidden;
  $("galPanel").hidden=true; $("filtPanel").hidden=true;
  if(wasFilt && cur){ const list=pool(); if(list.length && !list.includes(cur)) show(randomPlace()); else caption(cur, lastGeo.g); }
}

// ── Language
function applyLang(){
  const t=T[lang]; document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el=>{ el.textContent = t[el.dataset.t]; });
  document.querySelectorAll("[data-tip]").forEach(el=>{ const s=t[el.dataset.tip]; el.title=s; el.setAttribute("aria-label",s); });
  $("langBtn").textContent = lang==="vi"?"EN":"VI";
  $("loader").textContent = t.loading;
  if(cur && lastGeo) caption(cur, lastGeo.g);
  if(!$("galPanel").hidden) renderGallery();
  if(!$("filtPanel").hidden) renderFilters();
}

// ── Wiring
$("nextBtn").onclick=next; $("nextEdge").onclick=next;
$("prevBtn").onclick=prev; $("prevEdge").onclick=prev;
$("favBtn").onclick=toggleFav; $("dlBtn").onclick=download;
$("galBtn").onclick=()=>openPanel("galPanel"); $("filtBtn").onclick=()=>openPanel("filtPanel");
$("tabFav").onclick=()=>{galTab="fav";renderGallery()}; $("tabAll").onclick=()=>{galTab="all";renderGallery()};
$("langBtn").onclick=()=>{ lang = lang==="vi"?"en":"vi"; store.set("lang",lang); applyLang(); netBadge(); };
const toggleClean=()=>document.body.classList.toggle("clean");
$("hideBtn").onclick=toggleClean; $("unhide").onclick=toggleClean;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closePanels);
document.querySelectorAll(".panel").forEach(p=>p.addEventListener("click",e=>{ if(e.target===p) closePanels(); }));
addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const panelOpen = !$("galPanel").hidden || !$("filtPanel").hidden;
  if(e.key==="Escape"){ if(panelOpen) closePanels(); else document.body.classList.remove("clean"); return; }
  if(panelOpen) return;
  const k=e.key.toLowerCase();
  if(k==="arrowright"||k===" "||k==="n"){ e.preventDefault(); next(); }
  else if(k==="arrowleft"||k==="p") prev();
  else if(k==="f") toggleFav();
  else if(k==="d") download();
  else if(k==="g") openPanel("galPanel");
  else if(k==="h") toggleClean();
});
let rT; addEventListener("resize",()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(cur){ const g=render(cur); caption(cur,g);} },250); });
// Swipe on touch screens
let sx=null; stage.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>60) (dx<0?next:prev)(); });

let hiddenAt = 0;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){ hiddenAt = Date.now(); return; }
  if(hiddenAt && Date.now()-hiddenAt > 30*60*1000 && $("galPanel").hidden && $("filtPanel").hidden) show(randomPlace());
});
const netBadge = () => { const o=$("offline"); o.textContent=T[lang].offline; o.hidden = navigator.onLine; };
addEventListener("online", netBadge); addEventListener("offline", netBadge);
if("serviceWorker" in navigator && window.isSecureContext){ addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }

applyLang(); netBadge();
const fromHash = byId[decodeURIComponent(location.hash.slice(1))];
show(fromHash || randomPlace());
})();
</script>
